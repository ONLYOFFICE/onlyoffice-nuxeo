<link rel="import" href="onlyoffice-utils.html">

<dom-module id="onlyoffice-convert-button">
    <template>
        <style include="nuxeo-action-button-styles nuxeo-styles">
            #dropzone {
                display: block;
            }

            .convert {
                @apply --layout-horizontal;
                @apply --layout-center;
            }

            .convert .main {
                @apply --layout-vertical;
                @apply --layout-flex;
                overflow: hidden;
            }

            .convert .main .info {
                font-weight: 500;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .convert .main .progress {
                width: 100%;
                padding: 8px 0;
            }
        </style>

        <nuxeo-operation
                id="opOnlyofficeConvert"
                op="ONLYOFFICE.Convert"
                sync-indexing
        ></nuxeo-operation>

        <nuxeo-resource
                id="requestFormats"
                path="/onlyoffice/formats"
                headers='{"Content-Type": "application/json"}'
                response="{{onlyofficeFormats}}"
        ></nuxeo-resource>

        <nuxeo-document id="doc" doc-id="[[document.uid]]" response="{{document}}" sync-indexing></nuxeo-document>

        <dom-if if="[[_isAvailable(document,onlyofficeFormats,xpath)]]">
            <template>
                <div class="action" on-tap="_toggleDialog">
                    <paper-icon-button id="convertBtn" src="[[icon]]" noink aria-labelledby="label"></paper-icon-button>
                    <span class="label" hidden$="[[!showLabel]]" id="label">[[i18n('onlyoffice.convert.action')]]</span>
                    <nuxeo-tooltip>[[i18n('onlyoffice.convert.action')]]</nuxeo-tooltip>
                </div>
            </template>
        </dom-if>

        <nuxeo-dialog id="convertDialog" with-backdrop on-iron-overlay-closed="_onDialogClosed">
            <h2>[[i18n('onlyoffice.convert.action')]]</h2>

            <div class="convert">
                <div class="main">
                    <div class="info">[[_info]]</div>
                    <template is="dom-if" if="[[converting]]">
                        <paper-progress
                                class="progress"
                                indeterminate="true"
                                value="[[convertingProgress]]"
                        ></paper-progress>
                    </template>
                </div>
            </div>

            <div class="buttons">
                <paper-button class="secondary" on-tap="_cancel" dialog-dismiss>[[i18n('command.cancel')]]</paper-button>
                <paper-button class="primary" on-tap="_convert" disabled="[[converting]]" noink>[[i18n('onlyoffice.convert.submit')]]</paper-button>
            </div>
        </nuxeo-dialog>

    </template>

    <script>
        Polymer({
            is: 'onlyoffice-convert-button',
            behaviors: [
                Nuxeo.I18nBehavior,
                Nuxeo.FiltersBehavior,
                Nuxeo.ONLYOFFICEUtils
            ],

            properties: {
                document: Object,

                xpath: {
                    type: String,
                    value: 'file:content'
                },

                icon: {
                    type: String,
                    value: 'images/convert-action.svg',
                },

                showLabel: {
                    type: Boolean,
                    value: false,
                },

                _info: {
                    type: String,
                    computed: '_computeInfo(document,onlyofficeFormats)',
                },

                converting: {
                    type: Boolean,
                    value: false,
                    readOnly: true
                },

                convertingProgress: {
                    type: Number,
                    value: 0,
                    readOnly: true
                },

                // how long to wait for Document Server to finish a conversion, in milliseconds
                pollingTimeout: {
                    type: Number,
                    value: 300000
                }
            },

            detached() {
                this._stop();
            },

            _toggleDialog() {
                this.$.convertDialog.toggle();
            },

            _computeInfo() {
                return this.i18n('onlyoffice.convert.label', this.getTitle(this.document), this.getTargetTitle(this.document));
            },

            _isAvailable(doc) {
                // the slot is rendered for every blob of the document, but the conversion replaces the main file
                return (
                    doc &&
                    this.xpath === 'file:content' &&
                    this.hasPermission(doc, 'WriteProperties') &&
                    !this.isImmutable(doc) &&
                    !this.hasType(doc, 'Root') &&
                    !this.isTrashed(doc) &&
                    !this.isUnderRetentionOrLegalHold(doc) &&
                    !(this.hasFacet(doc, 'ColdStorage') && this.hasContent(doc, 'coldstorage:coldContent')) &&
                    this.isConvertible(doc)
                );
            },

            _convert() {
                this.$.opOnlyofficeConvert.params = {
                    id: this.document.uid,
                    language: window.nuxeo.I18n.language || 'en'
                };

                // every conversion started gets a number of its own: the answers to an earlier one, cancelled
                // or replaced, must neither go on polling nor end this one
                this._run = (this._run || 0) + 1;
                this._started = Date.now();
                this._setConverting(true);
                this._executeConvert(this._run);
            },

            _cancel() {
                this._stop();
            },

            // closed by Cancel, Esc, a click on the backdrop or the end of the conversion
            _onDialogClosed(e) {
                if (e.target === this.$.convertDialog) {
                    this._stop();
                }
            },

            _stop() {
                this._run = (this._run || 0) + 1;
                clearTimeout(this._pollTimer);
                this._clear();
            },

            _finish(message) {
                this.fire("notify", { message: message });
                this._stop();
                this.$.convertDialog.close();
            },

            _executeConvert(run) {
                if (run !== this._run || !this.converting) {
                    return;
                }

                this.$.opOnlyofficeConvert.execute().then((response) => {
                    if (run !== this._run) {
                        return;
                    }

                    var data = JSON.parse(response.value);

                    if (data.error) {
                        this._finish(this.i18n("onlyoffice.convert.message.error.service", this._getServiceErrorMessage(data.error)));
                        return;
                    }

                    if (data.percent != null) {
                      this._setConvertingProgress(data.percent);
                    }

                    if (data.endConvert) {
                        this._finish(this.i18n("onlyoffice.convert.message.success", this.getTitle(this.document)));
                        this.fire('document-updated');
                    } else if (Date.now() - this._started > this.pollingTimeout) {
                        this._finish(this.i18n("onlyoffice.convert.message.error.service", this._getServiceErrorMessage("TIMEOUT")));
                    } else {
                        this._pollTimer = setTimeout(() => this._executeConvert(run), 1000);
                    }
                }).catch((err) => {
                    if (run !== this._run) {
                        return;
                    }

                    this._finish(this.i18n("onlyoffice.convert.message.error.undefined"));
                    console.error(err);
                })
            },

            _clear() {
                this._setConverting(false);
                this._setConvertingProgress(0);
            },

            _getServiceErrorMessage(errorCode) {
                switch(errorCode) {
                    case "UNKNOWN":
                        return this.i18n("onlyoffice.service.convert.error.unknown");
                    case "TIMEOUT":
                        return this.i18n("onlyoffice.service.convert.error.timeout");
                    case "CONVERSION":
                        return this.i18n("onlyoffice.service.convert.error.conversion");
                        break;
                    case "DOWNLOADING":
                        return this.i18n("onlyoffice.service.convert.error.downloading");
                        break;
                    case "PASSWORD":
                        return this.i18n("onlyoffice.service.convert.error.password");
                        break;
                    case "DATABASE":
                        return this.i18n("onlyoffice.service.convert.error.database");
                        break;
                    case "INPUT":
                        return this.i18n("onlyoffice.service.convert.error.input");
                        break;
                    case "TOKEN":
                        return this.i18n("onlyoffice.service.convert.error.token");
                        break;
                    case "CONNECTION":
                        return this.i18n("onlyoffice.service.convert.error.connection");
                        break;
                    case "DOWNLOAD_RESULT":
                        return this.i18n("onlyoffice.service.convert.error.download_result");
                        break;
                    case "OOXML_OUTPUT_TYPE":
                        return this.i18n("onlyoffice.service.convert.error.ooxml_output_type");
                    case "SIZE_LIMIT_EXCEEDED":
                        return this.i18n("onlyoffice.service.convert.error.size_limit_exceeded");
                    default:
                        return this.i18n("onlyoffice.service.convert.error.unknown");
                }
            }
        });
    </script>
</dom-module>
