<dom-module id="onlyoffice-editor-button">
    <template>
        <nuxeo-resource
                id="filterONLYOFFICE"
                headers='{"Content-Type": "application/json"}'
        ></nuxeo-resource>

        <template is="dom-if" if="[[_isAvailable(document,config)]]" restamp>
            <div class="action" on-click="_openEditor">
                <paper-icon-button src="[[icon]]" noink></paper-icon-button>
                <span class="label" hidden$="[[!showLabel]]">[[i18n(label)]]</span>
                <paper-tooltip>[[i18n(label)]]</paper-tooltip>
            </div>
        </template>
    </template>
    <script>
        Polymer({
            is: 'onlyoffice-editor-button',
            behaviors: [
                Nuxeo.I18nBehavior,
                Nuxeo.FiltersBehavior
            ],
            properties: {
                document: Object,

                label: {
                    type: String,
                    value: ''
                },

                showLabel: {
                    type: Boolean,
                    value: false
                },

                icon: {
                    type: String,
                    value: 'images/icon_32.png'
                },

                editor: {
                    type: Object
                },

                config: {
                    type: Object,
                    value: () => ({}),
                },
            },

            observers: ['_documentChanged(document)'],

            detached() {
                this.cancelAsync(this._closedCheck);
            },

            // the answer for the previous document must not show until the one for this document arrives, nor
            // instead of it when it fails or comes after the answer of a later document
            _documentChanged(document) {
                this.config = {};
                if (!document || !document.uid) {
                    return;
                }

                const uid = document.uid;
                this.$.filterONLYOFFICE.path = `/onlyoffice/filter/${uid}`;
                this.$.filterONLYOFFICE.get().then((response) => {
                    if (this.document && this.document.uid === uid) {
                        this.config = response || {};
                    }
                }).catch(() => {});
            },

            getEditUrl: function() {
                var source = "../site/onlyedit/" + this.document.uid;
                return source;
            },

            _isAvailable: function(document) {
                if (this.config.mode == "view") {
                    this.label = 'label.onlyoffice.view';
                    return true;
                } else if (this.config.mode == "edit") {
                    this.label = 'label.onlyoffice.edit';
                    return true;
                }

                return false;
            },

            _openEditor: function() {
                this.cancelAsync(this._closedCheck);
                this.editor = window.open(this.getEditUrl(), '_blank');
                this._closedCheck = this.async(this._editorClosed, 1500);
            },

            _editorClosed: function() {
                if (!this.editor) return;
                if (this.editor.closed) {
                    this.editor = null;
                    this._closedCheck = this.async(this._refresh, 10500);
                } else {
                    this._closedCheck = this.async(this._editorClosed, 1500);
                }
            },

            _refresh: function() {
                this.fire('document-updated');
            }
        });
    </script>
</dom-module>
