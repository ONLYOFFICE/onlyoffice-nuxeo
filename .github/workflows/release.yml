name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the tag matches the project version
        run: |
          version="$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text.strip())")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pom.xml version $version"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: maven-private
          server-username-env-var: NUXEO_MAVEN_USERNAME
          server-password-env-var: NUXEO_MAVEN_PASSWORD

      - name: Build with Maven
        run: mvn -B -ntp clean install
        env:
          NUXEO_MAVEN_USERNAME: ${{ secrets.NUXEO_MAVEN_USERNAME }}
          NUXEO_MAVEN_PASSWORD: ${{ secrets.NUXEO_MAVEN_PASSWORD }}

      - name: Extract release notes
        run: |
          # Version sections and their subsections (## Added, ## Changed...) share the
          # same heading level, so a section ends at the next version heading only.
          awk -v ver="${GITHUB_REF_NAME#v}" '
            /^## \[?[0-9]+\.[0-9]+/ {
              h = $0; sub(/^## \[?/, "", h); sub(/\]?[[:space:]]*$/, "", h)
              p = (h == ver); next
            }
            p
          ' CHANGELOG.md > RELEASE.md
          if [ ! -s RELEASE.md ]; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi
          cat RELEASE.md

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          bodyFile: RELEASE.md
          tag: ${{ github.ref_name }}
          artifacts: onlyoffice-nuxeo-package/target/onlyoffice-nuxeo-package-*.zip
          artifactErrorsFailBuild: true
