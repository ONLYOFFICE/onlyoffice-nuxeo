name: Licenses

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
    paths:
      - '**/pom.xml'
      - '.check-licenses.yml'
      - '.github/workflows/licenses.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - '**/pom.xml'
      - '.check-licenses.yml'
      - '.github/workflows/licenses.yml'

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # LicenseFinder resolves the dependencies with Maven, and some Nuxeo artifacts are only in maven-private
      - name: Install Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          server-id: maven-private
          server-username-env-var: NUXEO_MAVEN_USERNAME
          server-password-env-var: NUXEO_MAVEN_PASSWORD

      # Restore only: the build job of ci.yml owns saving the shared cache key.
      - name: Restore Maven repository
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      # LicenseFinder runs a goal without a build, so onlyoffice-nuxeo-rest resolves onlyoffice-nuxeo-core
      # from the local repository, where the current version is only after an install.
      - name: Install Modules
        run: mvn -B -ntp install -Dmaven.test.skip=true -Dcheckstyle.skip
        env:
          NUXEO_MAVEN_USERNAME: ${{ secrets.NUXEO_MAVEN_USERNAME }}
          NUXEO_MAVEN_PASSWORD: ${{ secrets.NUXEO_MAVEN_PASSWORD }}

      - name: Get Repository License
        id: license
        run: |
          license="${{ (github.event.repository.license.spdx_id) || (github.event.repository.licenses[0]) }}"
          echo "License detected: $license"
          echo "license=$license" >> $GITHUB_OUTPUT

      - name: Check Licenses
        uses: ONLYOFFICE/check-licenses@v1
        with:
          project_license: ${{ steps.license.outputs.license }}
        env:
          NUXEO_MAVEN_USERNAME: ${{ secrets.NUXEO_MAVEN_USERNAME }}
          NUXEO_MAVEN_PASSWORD: ${{ secrets.NUXEO_MAVEN_PASSWORD }}
