name: Create Tag

on:
  push:
    branches: [master]
    paths:
      - 'pom.xml'

permissions:
  contents: write

jobs:
  create-tag:
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version
        id: info
        run: |
          version="$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text.strip())")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create tag
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          TAG="v$VERSION"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "$VERSION is a snapshot, skipping"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists"
            exit 0
          fi
          if ! grep -qE "^## \[?${VERSION//./\\.}\]?\s*$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git tag -a "$TAG" -m "Release/$TAG"
          git push origin "$TAG"
