name: E2E

on:
  workflow_dispatch:
    inputs:
      nuxeo_image:
        description: >-
          Nuxeo image. Nuxeo publishes its LTS images only on its private registry
          (docker-private.packages.nuxeo.com), so the NUXEO_REGISTRY_* secrets must match.
          The package is built against nuxeo-parent 2025.x, so the image should be a compatible LTS one.
        default: 'docker-private.packages.nuxeo.com/nuxeo/nuxeo:2025'
      documentserver_image:
        description: 'Document Server image'
        default: 'onlyoffice/documentserver:latest'
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.idea/**'
      - '.gitignore'
  pull_request:
    branches: [master, develop]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.idea/**'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Install Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          server-id: maven-private
          server-username: NUXEO_MAVEN_USERNAME
          server-password: NUXEO_MAVEN_PASSWORD

      - name: Restore Maven repository
        id: maven-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build with Maven
        timeout-minutes: 60
        run: mvn -B -ntp -U -Dmaven.artifact.threads=8 clean install
        env:
          NUXEO_MAVEN_USERNAME: ${{ secrets.NUXEO_MAVEN_USERNAME }}
          NUXEO_MAVEN_PASSWORD: ${{ secrets.NUXEO_MAVEN_PASSWORD }}

      - name: Drop failed resolution markers
        if: always()
        run: find ~/.m2/repository -name '*.lastUpdated' -delete || true

      - name: Save Maven repository
        if: always() && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}

      - name: Upload package
        timeout-minutes: 15
        uses: christopherHX/gitea-upload-artifact@v4
        with:
          name: plugin
          path: onlyoffice-nuxeo-package/target/onlyoffice-nuxeo-package-*.zip
          retention-days: 1
          if-no-files-found: error

  e2e:
    needs: build
    uses: ONLYOFFICE/integration-tests/.github/workflows/e2e.yml@f04b7386a7391f1065686b556abf66b860380e9d
    with:
      system: nuxeo
      artifact_name: plugin
      documentserver_image: ${{ inputs.documentserver_image || 'onlyoffice/documentserver:latest' }}
      env_overrides: NUXEO_IMAGE=${{ inputs.nuxeo_image || 'docker-private.packages.nuxeo.com/nuxeo/nuxeo:2025' }}
    secrets:
      nuxeo_clid: ${{ secrets.NUXEO_CLID }}
      nuxeo_registry_user: ${{ secrets.NUXEO_MAVEN_USERNAME }}
      nuxeo_registry_token: ${{ secrets.NUXEO_MAVEN_PASSWORD }}
