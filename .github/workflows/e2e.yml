name: E2E

on:
  workflow_dispatch:
    inputs:
      nuxeo_image:
        description: >-
          Nuxeo image. Nuxeo publishes its LTS images only on its private registry
          (docker-private.packages.nuxeo.com), so the NUXEO_REGISTRY_* secrets must match.
          The package is built against nuxeo-parent 2025.x, so the image must be a 2025 one.
        default: 'docker-private.packages.nuxeo.com/nuxeo/nuxeo:2025'
      documentserver_image:
        description: 'Document Server image'
        default: 'onlyoffice/documentserver:latest'
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.idea/**'
      - '.gitignore'
      - '.github/**'
  pull_request:
    branches: [master, develop]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.idea/**'
      - '.gitignore'
      - '.github/**'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Install Java 21
        uses: actions/setup-java@v7
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          server-id: maven-private
          server-username: NUXEO_MAVEN_USERNAME
          server-password: NUXEO_MAVEN_PASSWORD

      - name: Build with Maven
        run: mvn -B -ntp clean install
        env:
          NUXEO_MAVEN_USERNAME: ${{ secrets.NUXEO_MAVEN_USERNAME }}
          NUXEO_MAVEN_PASSWORD: ${{ secrets.NUXEO_MAVEN_PASSWORD }}

      - name: Upload package
        uses: christopherHX/gitea-upload-artifact@v4
        with:
          name: plugin
          path: onlyoffice-nuxeo-package/target/onlyoffice-nuxeo-package-*.zip
          retention-days: 1
          if-no-files-found: error

  e2e:
    needs: build
    uses: ONLYOFFICE/integration-tests/.github/workflows/e2e.yml@feature/nuxeo
    with:
      system: nuxeo
      artifact_name: plugin
      documentserver_image: ${{ inputs.documentserver_image || 'onlyoffice/documentserver:latest' }}
      env_overrides: NUXEO_IMAGE=${{ inputs.nuxeo_image || 'docker-private.packages.nuxeo.com/nuxeo/nuxeo:2025' }}
    secrets:
      nuxeo_clid: ${{ secrets.NUXEO_CLID }}
      nuxeo_registry_user: ${{ secrets.NUXEO_MAVEN_USERNAME }}
      nuxeo_registry_token: ${{ secrets.NUXEO_MAVEN_PASSWORD }}
