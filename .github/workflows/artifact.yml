name: Artifact

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened]
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
      - '.check-licenses.yml'
  
jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          server-id: maven-private
          server-username: NUXEO_MAVEN_USERNAME
          server-password: NUXEO_MAVEN_PASSWORD

      - name: Build with Maven
        run: mvn -B -ntp clean install
        env:
          NUXEO_MAVEN_USERNAME: ${{ secrets.NUXEO_MAVEN_USERNAME }}
          NUXEO_MAVEN_PASSWORD: ${{ secrets.NUXEO_MAVEN_PASSWORD }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: onlyoffice-nuxeo-package
          path: onlyoffice-nuxeo-package/target/onlyoffice-nuxeo-package-*.zip
